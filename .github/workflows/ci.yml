name: CI
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "plugins/quench-dev-tasks/server/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r plugins/quench-dev-tasks/server/requirements.txt

      - name: Syntax preflight (minimum supported Python)
        run: |
          python -m compileall -q plugins/quench-dev-tasks/server plugins/quench-dev-tasks/scripts scripts

      - name: IDE Schema Snapshot Drift Gate (read-only)
        run: |
          python scripts/export_ide_schemas.py --check

      - name: Single Provider Egress AST Gate (INV-9)
        run: |
          python plugins/quench-dev-tasks/scripts/check_no_api_bypass.py

      - name: Prompt-Surface Contract Gate (P1~P5)
        run: |
          python scripts/check_prompt_surface.py

      - name: Run test suite
        env:
          PYTHONPATH: plugins/quench-dev-tasks/server
        run: |
          pytest plugins/quench-dev-tasks/server/tests -v -rA --tb=short
