# ==============================================================================
# Quench Project Stack Manifest (Quench 项目特异化配置清单)
# Read by the quench-dev-tasks plugin to decouple project boundaries and tests.
# 供 quench-dev-tasks 插件读取，实现项目特定边界、测试套件与目录映射的解耦。
# ==============================================================================

# Configuration schema version (managed automatically / 配置架构版本)
schema_version: "1.0"

# Project name (Required / 项目名称)
project_name: "__PROJECT_NAME__"

# Task management directory (Relative to project root, default: docs/dev_tasks)
# 任务管理目录（相对于项目根目录，默认: docs/dev_tasks）
dev_tasks_dir: "docs/dev_tasks"

# Closed task archive directory (Relative to project root, default: docs/dev_tasks/archive)
# 已闭环任务归档目录（相对于项目根目录，默认: docs/dev_tasks/archive）
archive_dir: "docs/dev_tasks/archive"

# Changelog path (Relative to project root, default: CHANGELOG.md)
# 变更记录日志路径（相对于项目根目录，默认: CHANGELOG.md）
changelog_path: "CHANGELOG.md"

# Architecture design document path (Optional / 架构设计文档路径)
# architecture_doc: "docs/architecture/system_design.md"

# Test suite directory (Optional / 测试套件目录)
# test_dir: "tests"

# Default regression test runner command (Optional / 默认回归测试命令)
# test_runner: "pytest tests -v"

# ==============================================================================
# Project Engineering Constraints & Guidelines (项目工程规范与边界约束)
# Injected into agent prompts during architectural review and task execution.
# 支持根据项目所属技术栈定制，参考示例：
# ------------------------------------------------------------------------------
# [Example A: Web Full-Stack Development / Web 全栈开发 (FastAPI / Spring Boot + React / Vue)]
# - "All API schema updates must be synchronized with frontend clients"
# - "Core business logic changes must be covered by automated unit tests in tests/"
# - "Secrets, tokens, and private keys must never be hardcoded"
#
# [Example B: Cloud-Native Microservices & Distributed Systems / 云原生微服务 (Go / Rust / gRPC)]
# - "gRPC Protobuf contract updates must be backward-compatible"
# - "Concurrent state access must be thread-safe with zero connection leaks"
#
# [Example C: CLI Tools & Systems Engineering / CLI 命令行工具 (Python / Click / Cobra)]
# - "CLI commands must be cross-platform and UTF-8 safe across Windows, Linux, and macOS"
# - "Destructive options must require explicit confirmation"
#
# [Example D: Embedded & IoT / 嵌入式与物联网 (C/C++ / IoT)]
# - "Packet parsers must enforce boundary defense against buffer overflows"
# - "All hardware communication must feature timeout and retry mechanisms"
# ------------------------------------------------------------------------------
constraints:
  - "All core business and algorithmic changes must be accompanied by automated unit tests (所有核心逻辑变更必须伴随自动化测试)"
  - "All public interface and schema changes must remain backward-compatible or provide smooth migration (公共接口与数据结构变更须保持向后兼容)"
  - "Production secrets, private keys, and tokens must never be committed to the repository (严禁硬编码生产凭据或私有密钥)"

# ==============================================================================
# Tier 1: Fast-Track Static Whitelist Rules (第一层：快速通道静态白名单规则)
# List of glob patterns exempt from task state-machine checks.
# 允许免除任务状态机管控、直接修改的文件匹配模式（Glob）列表。
# ⚠️ Principle: Keep minimal. Starts empty, add patterns incrementally as needed.
# ⚠️ 维护原则：宁少勿多。默认为空单，由项目根据实际需求逐步添加。
# ==============================================================================
fast_track_rules:
  allow_untracked_patterns: []

# ==============================================================================
# Governance Scope Boundaries (代码审计管控边界 - Optional / 可选)
# By default, the dual-track heuristic engine automatically distinguishes production code from documents.
# 默认为空即可，内核会自动通过启发式双轨引擎智能识别生产代码与放行文档。
# 若需显式定义法定边界，可取消注释并配置：
# ==============================================================================
# governance_scope:
#   # 🔴 Managed production scope (Triggers state machine enforcement / 生产受管范围)
#   managed_paths:
#     - "src/**"
#     - "package.json"
#   # 🟢 Unmanaged documentation & design assets (Exempt from task flow / 自由放行范围)
#   unmanaged_paths:
#     - "docs/**"
#     - "*.md"

# ==============================================================================
# Reviewer Engine & External Architect Dispatch (审查模型与外置大脑调度配置)
# Decouples strategic reasoning from everyday execution.
# 支持可插拔的多厂商 API（DeepSeek / OpenAI / Ollama 等），实现通用架构分析与规范审查。
# ==============================================================================
reviewer_engine:
  # Dispatch mode: "auto" | "subagent" | "engine" | "manual" (默认: "auto")
  mode: "auto"

  # Strategy fallback sequence: "subagent" (IDE native) -> "engine" (direct API) -> "manual"
  strategy_order:
    - "subagent"
    - "engine"
    - "manual"

  # Upstream API Provider: "deepseek" | "openai" | "ollama" | "custom" | "none"
  provider: "deepseek"

  # Model identifier (e.g. deepseek-flash, deepseek-reasoner, gpt-4o)
  model: "deepseek-flash"

  # Environment variable name holding the API key
  # 存放 API 密钥的环境变量名称（严禁在配置文件中硬编码明文密钥）
  api_key_env: "DEEPSEEK_API_KEY_Quench"

  # Base API URL endpoint
  base_url: "https://api.deepseek.com"

  # Enable CoT thinking / reasoning content streaming
  # 是否开启思维链思考流输出 (reasoning_content)
  thinking: true

  # Reasoning effort budget: "low" | "medium" | "high"
  reasoning_effort: "high"

  # ==============================================================================
  # 超时分层配置（Timeout Layer Configuration）
  # 层间不变量：L1 ≤ L2_dynamic ≤ L3 < L4（宿主 MCP 传输超时）
  # 当前 L4 = 宿主 IDE MCP 客户端传输超时（不在 quench 可控范围内）。
  # 路径 A（当前有效，L4 未调大）：所有内部层压在 L4 以下；
  # 路径 B（L4 调大后）：下方 soft/hard 可调至 360s/480s/600s，需同步调大 L4 ≥ 660s。
  # ⚠️ 在 L4 未调大的前提下，将 soft/hard 设置为 8min/10min 是无效工程（死配置）。
  # ==============================================================================

  # L1 单跳传输超时（per-hop network timeout，非整体预算）
  # 对旗舰推理模型 120s 更为合适；须满足 L1 × max_tool_hops ≤ soft_budget_cap_seconds
  timeout_seconds: 120

  # L2 软预算（动态公式：base + per_hop × hops，上限 cap）
  # 当前路径 A：所有值必须 < L4（≈180s），留 10s 余量
  soft_budget_base_seconds: 90      # 基础预算 base（秒）
  soft_budget_per_hop_seconds: 20   # 每跳增量（秒），使 L1 × hops 不超 L2
  soft_budget_cap_seconds: 170      # L2 软上限 cap（须 ≤ hard_ceiling_seconds）

  # L3 硬天花板（整体最大允许时长，须 < L4）
  hard_ceiling_seconds: 175         # 留 5s 余量给序列化/收尾

  # Max retry attempts on network error / 瞬态网络故障最大重试次数
  max_retries: 2

  # Max multi-turn tool hops during review refinement / 审查推导最大工具调用轮数
  max_tool_hops: 3

  # Context Guard: Global character ceiling across all injected code slices (512 - 200,000)
  # 全局注入字符上限聚合预算（防止上下文无限膨胀击穿 Prompt 预算）
  max_total_injection_chars: 40000

  # Context Guard: Default line count when no line range is explicitly provided (30 - 2000)
  # 缺省单文件上下文切片行数窗口
  default_window_lines: 200

  # Context Guard: Maximum lines allowed per explicit slice (30 - 5000)
  # 单次切片最大允许行数硬天花板
  max_lines_per_slice: 600

# ==============================================================================
# Reviewer Observability & Verdict Audit (审查可观测性与裁决快照审计配置)
# Governs streaming log capture vs. lightweight snapshot audit across dispatch modes.
# 兼顾引擎模式细粒度流式观测与子代理模式下的零空写 I/O，并建立永久裁决快照通道。
# ==============================================================================
observability:
  # Path to verdict audit log (Relative to project root or absolute, default: .agents/logs/reviewer/verdicts.jsonl)
  # 最终裁决快照审计日志路径（行式 JSONL 格式）
  verdict_path: ".agents/logs/reviewer/verdicts.jsonl"

  # Maximum size in bytes for a single verdict audit record / 单条裁决审计行物理字节硬上限 (默认 16KB)
  max_record_bytes: 16384

  # Whether to force streaming disk capture in subagent mode / 是否在子代理模式下强制写流式盘（默认 false 保持零空写）
  stream_in_subagent: false

# ==============================================================================
# Microkernel Governance & Fencing Token Lease (微内核治理与 Fencing Token 租约配置)
# Governs authoritative manifest tracking, atomic CAS leases, and reaper probe.
# 管控权威清单登记、单调 CAS 租约与智能条件判断回收器。
# ==============================================================================
governance:
  # Path to central authoritative manifest (Relative to project root, default: .agents/.quorch/manifest.json)
  # 中心化权威清单路径（记录任务代际与租约拥有者）
  manifest_path: ".agents/.quorch/manifest.json"

  # Lease TTL in seconds / 租约超时时间（秒，默认 300 秒）
  lease_ttl_seconds: 300

# ==============================================================================
# Reviewer Long-Running Asynchronous Jobs (审查长推演异步任务制配置)
# Governs polling intervals, TTL, snapshot byte limits, and capacity admission.
# 管控轮询间隔退避、任务留存 TTL、1KB 极简快照上限与并发准入控制。
# ==============================================================================
reviewer_jobs:
  # Default polling interval in seconds / 默认推荐轮询间隔（秒，默认 8）
  poll_interval_default: 8

  # Minimum polling interval in seconds / 最小轮询保护下限（秒，默认 2）
  poll_min_interval: 2

  # Maximum polling interval in seconds / 最大轮询退避上限（秒，默认 30）
  poll_max_interval: 30

  # Job record & result TTL in seconds / 终态任务留存超时（秒，默认 1800）
  job_ttl_seconds: 1800

  # Maximum concurrent active review jobs / 最大在途并发推演任务数（默认 4）
  max_concurrent_jobs: 4

  # Strict byte ceiling for non-terminal poll snapshots / 非终态轮询快照严格物理字节上限（默认 1024）
  max_snapshot_bytes: 1024

  # Whether to reconcile and clean orphaned jobs on supervisor load / 是否在服务载入时对账清理孤儿任务（默认 true）
  reconcile_on_load: true



