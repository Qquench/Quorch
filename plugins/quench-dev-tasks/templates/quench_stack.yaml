# ==============================================================================
# Quench 项目特异化配置清单 (Quench Project Stack Manifest)
# 供 quench-dev-tasks Plugin 读取，实现项目特定边界、测试套件与目录映射的解耦。
# ==============================================================================

# 配置架构版本（系统自动管理）
schema_version: "1.0"

# 项目名称（必填）
project_name: "__PROJECT_NAME__"

# 任务管理目录（相对于项目根目录，默认: docs/dev_tasks）
dev_tasks_dir: "docs/dev_tasks"

# 已闭环任务归档目录（相对于项目根目录，默认: docs/dev_tasks/archive）
archive_dir: "docs/dev_tasks/archive"

# 变更记录日志路径（相对于项目根目录，默认: CHANGELOG.md）
changelog_path: "CHANGELOG.md"

# 系统架构设计手册路径（可选，供高阶架构审查时优先阅读建立上下文）
# architecture_doc: "docs/architecture/system_design.md"

# 测试套件目录（可选，供 DoD 断言物理审计使用，默认: tests）
# test_dir: "tests"

# 默认安全回归测试命令（可选）
# test_runner: "pytest tests -v"

# 项目通用工程规范与边界约束（自动注入给架构审查与日常执行提示词）
constraints:
  - "所有核心业务与算法逻辑变更，必须伴随自动化测试验证，确保测试套件全部通过"
  - "所有公共接口与数据结构变更，必须保持向后兼容或提供平滑迁移路径"
  - "严禁将生产凭据、密钥或私有 Token 硬编码在代码仓库中"

# ==============================================================================
# 第一层：快速通道静态白名单规则（Fast-Track Rules）
# 允许免除任务状态机管控、直接修改的文件匹配模式（Glob）列表。
# ⚠️ 维护原则：宁少勿多。默认为空单，由项目根据实际需求逐步添加。
# ==============================================================================
fast_track_rules:
  allow_untracked_patterns: []

# ==============================================================================
# 代码审计管控边界 (Governance Scope Boundaries - 可选)
# 默认为空即可，内核会自动通过启发式双轨引擎智能识别生产代码与放行文档。
# 若需显式定义法定边界，可取消注释并配置：
# ==============================================================================
# governance_scope:
#   # 🔴 生产受管范围（强触发任务状态机）
#   managed_paths:
#     - "src/**"
#     - "package.json"
#   # 🟢 自由放行范围（文档、规划、设计素材，免除任务流程）
#   unmanaged_paths:
#     - "docs/**"
#     - "*.md"
