[project]
name = "quench-dev-tasks-server"
version = "0.1.0"
description = "FastMCP Server for Quench DevTasks Orchestrator"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "pyyaml>=6.0",
    "filelock>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
quench = "cli:main"
quorch = "cli:main"

[tool.pyrefly]
search-path = ["../../../scripts", "tests"]

[tool.pyrefly.errors]
unnecessary-type-conversion = "ignore"

