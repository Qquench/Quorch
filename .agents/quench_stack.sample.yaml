# ==============================================================================
# Quench 本地配置示例参考清单 (.agents/quench_stack.sample.yaml)
#
# ⚠️ 说明 (Important Notice)：
# 1. 本文件为参考文档与模板样例，Quench 配置加载器【不会】直接读取本文件。
# 2. 团队通用治理基线位于 .agents/quench_stack.yaml（受 Git 版本控制）。
# 3. 如需在本机配置特定的 Reviewer 审计引擎，请将本文件的相关配置段复制到：
#    👉 .agents/quench_stack.local.yaml （已被 .gitignore 忽略，绝不会意外提交密钥）
# ==============================================================================

# ------------------------------------------------------------------------------
# 示例 1: DeepSeek 官方 API（推荐，高性价比推理引擎）
# ------------------------------------------------------------------------------
# reviewer_engine:
#   provider: "deepseek"
#   model: "deepseek-flash"           # 或 "deepseek-reasoner"
#   base_url: "https://api.deepseek.com"
#   api_key_env: "DEEPSEEK_API_KEY"   # 环境变量名，严禁硬编码明文密钥
#   thinking: true                    # 开启思维链推导流输出
#   reasoning_effort: "high"
#   timeout_seconds: 180

# ------------------------------------------------------------------------------
# 示例 2: 通用 OpenAI 兼容接口 / 聚合网关 (OpenAI-compatible Custom API)
