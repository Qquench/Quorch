# ==============================================================================
# Quench Project Configuration Sample (.agents/quench_stack.sample.yaml)
# Copy this file to .agents/quench_stack.local.yaml for local developer overrides (git-ignored)
# ==============================================================================

# Base configuration is declared in quench_stack.yaml.
# In local override file quench_stack.local.yaml, only declare fields requiring customization.

# Example 1: Remote OpenAI-compatible API endpoint (API key sourced from environment variable)
# reviewer_engine:
#   provider: "custom"
#   model: "your-model-name"
#   base_url: "https://api.your-provider.com/v1"
#   api_key_env: "YOUR_PROVIDER_API_KEY"
#   thinking: true
#   reasoning_effort: "high"

# Example 2: Local Ollama server (offline, zero credentials required)
# reviewer_engine:
#   provider: "custom"
#   model: "qwen2.5-coder:14b"
#   base_url: "http://127.0.0.1:11434/v1"

# Example 3: Local vLLM private server (offline, zero credentials required)
# reviewer_engine:
#   provider: "custom"
#   model: "default"
#   base_url: "http://127.0.0.1:8000/v1"

# Example 4: Corporate proxy / aggregator gateway
# reviewer_engine:
#   provider: "custom"
#   model: "internal-reviewer"
#   base_url: "https://llm-gateway.corp.internal/v1"
#   api_key_env: "CORP_GATEWAY_TOKEN"

# Example 5: Audit gate configuration override
# audit_gate:
#   enabled: true
#   on_missing_record: "block"
#   # tail_window_exhausted_policy 已弃用并收敛为 on_degraded 的别名（生效值遵循最严优先：block > warn > allow）
#   on_degraded: "warn"
#   on_internal_error: "allow"
