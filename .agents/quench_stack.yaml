# ==============================================================================
# Quench Project Stack Baseline Configuration
# Read by the quench-dev-tasks plugin to enforce repository self-governance.
#
# ⚠️ ARCHITECTURE & CONFIGURATION LAYER NOTICE (FOR LLM AGENTS & DEVELOPERS):
# 1. This file is the Git-tracked SSOT baseline for team governance (scope, tests, audit gates).
# 2. NEVER write plaintext API keys, personal secrets, or local endpoints into this file!
# 3. Machine-specific Reviewer engine configurations (provider, model, base_url, api_key_env, etc.)
#    MUST be placed in:
#    👉 .agents/quench_stack.local.yaml  (strictly .gitignored)
# 4. If you see 'provider: "none"' below, it ONLY means the repository baseline does not bundle
#    a default external model. Check .agents/quench_stack.local.yaml for active local overrides.
# 5. For full reference schemas and multi-engine configuration examples, see:
#    👉 .agents/quench_stack.sample.yaml
# ==============================================================================

project_name: "quench-dev-orchestrator"

dev_tasks_dir: "docs/dev_tasks"
archive_dir: "docs/dev_tasks/archive"
changelog_path: "CHANGELOG.md"
architecture_doc: "docs/architecture/README.md"

test_dir: "plugins/quench-dev-tasks/server/tests"
test_runner: "pytest plugins/quench-dev-tasks/server/tests"

constraints:
  - "This repository is a FastMCP + Antigravity dual-model dev-task governance suite; core domain is protocol & security gateway"
  - "FastMCP tool layer must maintain cross-platform compatibility and lightweight footprint; hardcoded client bindings are strictly forbidden"
  - "File governance pre-hooks must respond within 50ms; any session lock verification failure must be idempotently cleaned up"
  - "All production-grade changes must achieve 100% test coverage under pytest suite with zero breaking regressions"

fast_track_rules:
  allow_untracked_patterns: []

governance_scope:
  managed_paths:
    - "plugins/quench-dev-tasks/server/**"
    - "plugins/quench-dev-tasks/hooks.json"
    - "plugins/quench-dev-tasks/plugin.json"
    - "plugins/quench-dev-tasks/mcp_config.json"
    - "plugins/quench-dev-tasks/rules/**"
    - "plugins/quench-dev-tasks/skills/**"
    - "plugins/quench-dev-tasks/agents/**"
  unmanaged_paths:
    - "docs/**"
    - "*.md"

schema_version: "1.0"
# Configuration specification version (integer; used for orchestrator migration & backward compatibility)
config_version: 1

# Baseline Reviewer Engine Configuration (Default placeholder: "none")
# ⚠️ NOTE FOR AI AGENTS:
# Do NOT assume Reviewer is unconfigured based solely on 'provider: "none"' below!
# Machine-specific engines (e.g., deepseek, custom API, ollama, etc.) are declared
# as private overrides in '.agents/quench_stack.local.yaml' (.gitignored).
reviewer_engine:
  provider: "none"
  model: "default"
  api_key_env: null
  base_url: ""
  thinking: true
  reasoning_effort: "high"
  timeout_seconds: 180
  max_total_injection_chars: 40000
  default_window_lines: 200
  max_lines_per_slice: 600

observability:
  verdict_path: ".agents/logs/reviewer/verdicts.jsonl"
  max_record_bytes: 16384
  stream_in_subagent: false

governance:
  manifest_path: ".agents/.quorch/manifest.json"
  lease_ttl_seconds: 300

audit_gate:
  enabled: true
  on_missing_record: "block"
  # Note: tail_window_exhausted_policy is deprecated and aliased to on_degraded (most-restrictive-wins: block > warn > allow)
  on_degraded: "warn"
  on_internal_error: "allow"
