# ==============================================================================
# Quench 项目特异化配置清单 (Quench Project Stack Manifest)
# 供 quench-dev-tasks 插件读取，实现 MCP 仓库本身的自我治理与规范驱动演进。
# ==============================================================================

project_name: "quench-dev-orchestrator"

dev_tasks_dir: "docs/dev_tasks"
archive_dir: "docs/dev_tasks/archive"
changelog_path: "CHANGELOG.md"
architecture_doc: "docs/architecture/README.md"

test_dir: "plugins/quench-dev-tasks/server/tests"
test_runner: "pytest plugins/quench-dev-tasks/server/tests"

constraints:
  - "This repository is a FastMCP + Antigravity dual-model dev-task governance suite; core domain is protocol & security gateway"
  - "FastMCP tool layer must maintain cross-platform compatibility and lightweight footprint; hardcoded client bindings are strictly forbidden"
  - "File governance pre-hooks must respond within 50ms; any session lock verification failure must be idempotently cleaned up"
  - "All production-grade changes must achieve 100% test coverage under pytest suite with zero breaking regressions"

fast_track_rules:
  allow_untracked_patterns: []

governance_scope:
  managed_paths:
    - "plugins/quench-dev-tasks/server/**"
    - "plugins/quench-dev-tasks/hooks.json"
    - "plugins/quench-dev-tasks/plugin.json"
    - "plugins/quench-dev-tasks/mcp_config.json"
    - "plugins/quench-dev-tasks/rules/**"
    - "plugins/quench-dev-tasks/skills/**"
    - "plugins/quench-dev-tasks/agents/**"
  unmanaged_paths:
    - "docs/**"
    - "*.md"

schema_version: "1.0"

reviewer_engine:
  provider: "deepseek"
  model: "deepseek-flash"
  api_key_env: "DEEPSEEK_API_KEY_Quench"
  base_url: "https://api.deepseek.com"
  thinking: true
  reasoning_effort: "high"
  timeout_seconds: 180
  max_total_injection_chars: 40000
  default_window_lines: 200
  max_lines_per_slice: 600

observability:
  verdict_path: ".agents/logs/reviewer/verdicts.jsonl"
  max_record_bytes: 16384
  stream_in_subagent: false

governance:
  manifest_path: ".agents/.quorch/manifest.json"
  lease_ttl_seconds: 300

audit_gate:
  enabled: true
  on_missing_record: "block"
  on_degraded: "warn"
  tail_window_exhausted_policy: "warn"
  on_internal_error: "allow"
