[tool.pytest.ini_options]
pythonpath = ["plugins/quench-dev-tasks/server"]
markers = [
    "tier1_fast: fast unit and smoke tests for rapid inner-loop feedback (<=5s budget)",
    "slow: heavy cross-platform CLI integration cases",
    "concurrent_moat: heavy concurrency and CAS race moat tests",
    "heavy: heavyweight integration or stress tests",
]

[tool.pyrefly]
search-path = ["scripts", "plugins/quench-dev-tasks/scripts", "plugins/quench-dev-tasks/server", "plugins/quench-dev-tasks/server/hooks", "plugins/quench-dev-tasks/server/tests"]

[tool.pyrefly.errors]
unnecessary-type-conversion = "ignore"
untyped-import = "ignore"

[tool.pyright]
extraPaths = ["scripts", "plugins/quench-dev-tasks/scripts", "plugins/quench-dev-tasks/server", "plugins/quench-dev-tasks/server/hooks", "plugins/quench-dev-tasks/server/tests"]
reportUnsupportedDunderAll = "none"

